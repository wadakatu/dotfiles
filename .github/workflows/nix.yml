# nix-darwin の flake が壊れていないかを検証する CI。
# 旧 installation.yaml / shell_check.yml (レガシースクリプト用) の後継。
#
# public repository の standard macOS runner は無料で利用できるため、
# Linuxでの評価に加えてApple Silicon上の実ビルドも常時行う。
name: nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# determinate-nix-action が FlakeHub Cache を OIDC で利用するために必要。
permissions:
  id-token: write
  contents: read

jobs:
  # ── Linux で flake を評価検証 ────────────────────────────
  # nix flake check は darwinConfigurations を「評価するだけでビルドしない」
  # (ローカルで build skipped を確認済み)。評価はクロスプラットフォームで
  # 可能なので、aarch64-darwin 構成でも Linux 上で型・オプション名を検証できる。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix flake check
        run: nix flake check --show-trace
      # 無人のエージェントの commit / push を止める hook なので、すり抜けを CI で見張る。
      - name: branch-guard hook
        run: sh tests/branch-guard.sh
      # 無人でメモリを消す・PR を出すスクリプトなので、ガードと公開前検査を CI で見張る。
      - name: memory-maintenance script
        run: bash tests/memory-maintenance.sh
      # 無人で worktree を消すスクリプトなので、作業中のものを消さないことを CI で見張る。
      - name: worktree-gc script
        run: bash tests/worktree-gc.sh
      # 人のセッションを止めるスクリプトなので、keep に倒す判定と入力欄の確認を CI で見張る。
      - name: agent-gc script
        run: bash tests/agent-gc.sh
      # skill・rule・LaunchAgent のスクリプトが読む場所を作るスクリプトなので、失敗しても前の版が残ることを CI で見張る。
      - name: live-sync script
        run: bash tests/live-sync.sh
      # 無人で worktree とエージェントを起動するスクリプトなので、勝手に起動しないことと復旧を CI で見張る。
      - name: issue-autopilot script
        run: bash tests/issue-autopilot.sh
      # 2 つのスクリプトが同じ worktree にエージェントを同時に起動しないことと、残ったロックで止まり続けないことを CI で見張る。
      - name: dispatch-lock
        run: bash tests/dispatch-lock.sh
      # 再開を依頼したのに記録が無い、を作らないことを CI で見張る (記録は pr-dispatch が起動を待つのに使う)。
      - name: agent-resume script
        run: bash tests/agent-resume.sh

  # ── 現 Mac と同系統の macOS 26 / arm64 で実ビルド ─────────
  build-darwin:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: build darwin system
        run: nix build .#darwinConfigurations.{work,personal}.system --no-link --show-trace
